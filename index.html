<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="author" content="wangzhuo">

<title>魔方坠落 · 手势俄罗斯方块</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<!--<link rel="apple-touch-icon" href="logo.png">-->
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05060d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden; overscroll-behavior: none;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(110,80,220,0.20), transparent 70%),
      radial-gradient(ellipse 70% 50% at 50% 100%, rgba(30,180,190,0.14), transparent 70%),
      #05060d;
  }
  #app {
    width: 100%; max-width: 440px; height: 100%; max-height: 940px;
    display: flex; flex-direction: column;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    position: relative;
  }

  /* ---------- 顶栏 ---------- */
  .hud { display: flex; gap: 8px; align-items: stretch; margin-bottom: 8px; }
  .stats { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .cardk {
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 6px 9px;
  }
  .cardk .k { font-size: 9px; letter-spacing: .14em; color: rgba(255,255,255,0.4); text-transform: uppercase; }
  .cardk .v { font-size: 17px; font-weight: 600; color: #fff; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .cardk.wide { grid-column: span 2; }
  .cardk.wide .v { color: #ffd84d; }

  .nextbox {
    width: 64px; background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 3px;
  }
  .nextbox .k { font-size: 9px; letter-spacing: .14em; color: rgba(255,255,255,0.4); text-align: center; }
  .nextrow { display: flex; flex: 1; align-items: center; overflow: hidden; }
  .nextrow canvas { width: 100% !important; height: 42px; display: block; }

  /* ---------- 舞台 ---------- */
  #stage { flex: 1; position: relative; min-height: 0; }
  /* 绝对定位贴合舞台：画布不参与流式布局，尺寸失配时也不会把内容顶偏 */
  #board { display: block; touch-action: none; position: absolute; left: 0; top: 0; }

  /* ---------- 底栏 ---------- */
  .footer { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .hint {
    flex: 1; font-size: 11px; color: rgba(255,255,255,0.42); line-height: 1.5;
    background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px; padding: 7px 10px;
  }
  .hint b { color: rgba(255,255,255,0.72); font-weight: 500; }
  .btn {
    border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06);
    color: #fff; border-radius: 10px; padding: 9px 14px; font-size: 13px;
    cursor: pointer; font-family: inherit;
  }
  .btn:active { background: rgba(255,255,255,0.14); }

  /* ---------- 遮罩 ---------- */
  #overlay {
    position: absolute; inset: 0; z-index: 10;
    background: rgba(5,6,13,0.92); backdrop-filter: blur(6px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 26px; color: #fff; margin: 0 0 4px; font-weight: 600; letter-spacing: .02em; }
  #overlay .sub { font-size: 12px; color: rgba(255,255,255,0.45); margin-bottom: 20px; letter-spacing: .1em; }
  /* 五条操作提示，间距和内边距都收紧一档，保证在矮屏上整块不被挤出视口 */
  .guide { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
  .grow {
    display: flex; align-items: center; gap: 10px; text-align: left;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
    border-radius: 11px; padding: 7.5px 10px;
  }
  .gicon { width: 28px; height: 28px; flex-shrink: 0; }
  .gtext { font-size: 12px; color: rgba(255,255,255,0.82); line-height: 1.45; }
  .gtext em { display: block; font-style: normal; font-size: 10.5px; color: rgba(255,255,255,0.42); margin-top: 1px; }
  .cta {
    background: linear-gradient(135deg, #7c5cf5, #4ac2d8); border: none; color: #fff;
    padding: 13px 46px; border-radius: 12px; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit; letter-spacing: .05em;
  }
  .cta:active { opacity: .85; }
  /* 主菜单模式选择：单机 / 联机 双按钮 */
  .cta.online { background: linear-gradient(135deg, #2f9bd6, #4ac2d8); }
  .cta-row { display: flex; flex-direction: column; gap: 12px; align-items: center; width: 100%; max-width: 280px; margin-top: 2px; }
  .cta-row .cta { width: 100%; }
  /* 模态窗内多按钮竖排（暂停 / 结算） */
  .cta-stack { display: flex; flex-direction: column; gap: 12px; align-items: center; width: 100%; max-width: 280px; margin-top: 4px; }
  .cta-stack .cta { width: 100%; }
  /* 次按钮（退出本局 / 返回主界面）：低调描边样式 */
  .cta.ghost { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.72); box-shadow: none; }
  .cta.ghost:active { background: rgba(255,255,255,0.14); opacity: 1; }
  .mode-tip { font-size: 11px; color: rgba(255,255,255,0.42); letter-spacing: .04em; margin-top: 2px; text-align: center; line-height: 1.5; }
  .final { display: flex; gap: 26px; margin-bottom: 22px; }
  .final div { text-align: center; }
  .final .fk { font-size: 10px; color: rgba(255,255,255,0.4); letter-spacing: .12em; }
  .final .fv { font-size: 25px; color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }
  .final .fv.gold { color: #ffd84d; }

  /* 作者署名：固定在遮罩窗口底部居中 */
  .sign {
    position: absolute; left: 0; right: 0; bottom: 14px;
    text-align: center; font-size: 11px; letter-spacing: .06em;
    color: rgba(255,255,255,0.28); pointer-events: none;
    -webkit-user-select: none; user-select: none;
  }
  .sign b { font-weight: 600; color: rgba(255,255,255,0.42); }

  /* ---------- 新手引导层 ---------- */
  #tut {
    position: absolute; inset: 0; z-index: 20; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    /* 四周轻微压暗，把注意力聚焦到中央棋盘与练习方块 */
    background: radial-gradient(ellipse 70% 50% at 50% 40%, transparent 42%, rgba(5,6,13,0.62) 100%);
  }
  #tut.hidden { display: none; }
  .tut-top { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  .tut-dots { display: flex; gap: 6px; flex: 1; }
  .tut-dots .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255,255,255,0.22); transition: all .2s;
  }
  .tut-dots .dot.on { background: rgba(255,255,255,0.55); }
  .tut-dots .dot.cur { background: #7c5cf5; width: 18px; border-radius: 4px; }
  .tut-prog { font-size: 11px; color: rgba(255,255,255,0.6); font-variant-numeric: tabular-nums; }
  .tut-skip {
    pointer-events: auto; font-size: 11px; color: rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px; padding: 4px 10px; cursor: pointer; font-family: inherit;
  }
  .tut-skip:active { background: rgba(255,255,255,0.14); }

  .tut-card {
    pointer-events: none; margin: 0 12px calc(12px + env(safe-area-inset-bottom));
    background: rgba(14,16,28,0.92); border: 1px solid rgba(255,255,255,0.10);
    border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  .tut-card .gicon { width: 34px; height: 34px; flex-shrink: 0; }
  .tut-text { flex: 1; min-width: 0; }
  .tut-title { font-size: 15px; font-weight: 600; color: #fff; }
  .tut-desc { font-size: 11.5px; color: rgba(255,255,255,0.55); line-height: 1.5; margin-top: 2px; }
  .tut-status {
    flex-shrink: 0; font-size: 11px; color: rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.06); border-radius: 8px; padding: 6px 10px; white-space: nowrap;
  }
  .tut-status.ok { color: #7ef0a8; background: rgba(126,240,168,0.12); }

  /* 教程期间隐藏底栏（暂停按钮/操作提示），避免与引导卡重叠和误触 */
  .tut-mode .footer { display: none; }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="stats">
      <div class="cardk wide"><div class="k">Score</div><div class="v" id="s-score">0</div></div>
      <div class="cardk"><div class="k">Level</div><div class="v" id="s-level">0</div></div>
      <div class="cardk"><div class="k">Lines</div><div class="v" id="s-lines">0</div></div>
    </div>
    <div class="nextbox">
      <div class="k">NEXT</div>
      <div class="nextrow">
        <canvas id="n0"></canvas>
      </div>
    </div>
  </div>

  <div id="stage"><canvas id="board"></canvas></div>

  <div class="footer">
    <div class="hint">
      <b>横滑</b>移动 · <b>上滑或双击</b>旋转 · <b>按住方块</b>拖到落点<br>
      <b>长按空白</b>蓄力，松手弹射
    </div>
    <button class="btn" id="btn-pause">暂停</button>
  </div>

  <div id="overlay"></div>

  <div id="tut" class="hidden">
    <div class="tut-top">
      <div class="tut-dots" id="tut-dots"></div>
      <div class="tut-prog" id="tut-prog"></div>
      <button class="tut-skip" id="tut-skip">跳过</button>
    </div>
    <div class="tut-card">
      <div class="gicon" id="tut-icon"></div>
      <div class="tut-text">
        <div class="tut-title" id="tut-title"></div>
        <div class="tut-desc" id="tut-desc"></div>
      </div>
      <div class="tut-status" id="tut-status">请在棋盘上试一试</div>
    </div>
  </div>
</div>

<script src="src/core.js"></script>
<script src="src/fx.js"></script>
<script src="src/gesture.js"></script>
<script src="src/render.js"></script>
<script src="src/tutorial.js"></script>
<script src="src/game.js"></script>
<script>
(function () {
  'use strict';
  var TZ = window.TZ;

  var elScore = document.getElementById('s-score');
  var elLevel = document.getElementById('s-level');
  var elLines = document.getElementById('s-lines');
  var overlay = document.getElementById('overlay');
  var nexts = [document.getElementById('n0')];   // 只预览下一个方块

  var ICONS = {
    move: '<svg class="gicon" viewBox="0 0 32 32" fill="none"><rect x="10" y="10" width="12" height="12" rx="2.5" fill="#7c5cf5"/><path d="M6.5 16H2.5M2.5 16l2.4-2.4M2.5 16l2.4 2.4" stroke="#8f8ad0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M25.5 16h4M29.5 16l-2.4-2.4M29.5 16l2.4 2.4" stroke="#8f8ad0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    rotate: '<svg class="gicon" viewBox="0 0 32 32" fill="none"><rect x="11" y="13" width="11" height="11" rx="2.5" fill="#4ac2d8"/><path d="M9 12a8.5 8.5 0 0 1 14.5 3" stroke="#7fd8e6" stroke-width="1.7" stroke-linecap="round" fill="none"/><path d="M8.4 7.6v4.8h4.8" stroke="#7fd8e6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>',
    nav: '<svg class="gicon" viewBox="0 0 32 32" fill="none"><rect x="11" y="4" width="10" height="10" rx="2.5" fill="#f2932b"/><path d="M16 15.5v8" stroke="#f5b96e" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="2.6 2.6"/><rect x="11.5" y="24" width="9" height="5" rx="1.6" stroke="#f5b96e" stroke-width="1.6" stroke-dasharray="3 2.4" fill="none"/></svg>',
    charge: '<svg class="gicon" viewBox="0 0 32 32" fill="none"><path d="M5 7c4.5 5 17.5 5 22 0" stroke="#ffd84d" stroke-width="1.7" stroke-linecap="round" fill="none"/><rect x="11.5" y="8.5" width="9" height="9" rx="2.2" fill="#ffd84d"/><path d="M16 20.5v7M16 28.5l-2.6-3M16 28.5l2.6-3" stroke="#ffb84d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    dtap: '<svg class="gicon" viewBox="0 0 32 32" fill="none"><rect x="12" y="14" width="10" height="10" rx="2.4" fill="#4ac2d8"/><path d="M10.5 13a7.6 7.6 0 0 1 13-1.4" stroke="#7fd8e6" stroke-width="1.7" stroke-linecap="round" fill="none"/><path d="M23.9 7.4v4.4h-4.4" stroke="#7fd8e6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="6.6" cy="24.6" r="2.6" fill="#7fd8e6"/><circle cx="6.6" cy="24.6" r="5.2" stroke="#7fd8e6" stroke-width="1.3" stroke-dasharray="2.4 2.2" fill="none"/></svg>'
  };
  TZ.icons = ICONS;   // 供新手引导层复用相同的操作图标

  var GUIDE = [
    [ICONS.move, '左右横滑', '棋盘任意处滑动，方块逐格跟手'],
    [ICONS.rotate, '向上滑动旋转', '方块左侧顺时针，右侧逆时针'],
    [ICONS.dtap, '空白处双击旋转', '一律顺时针，不必瞄准方块'],
    [ICONS.nav, '按住方块拖到落点', '松手自动寻路就位'],
    [ICONS.charge, '长按空白蓄力', '松手弹射，力度越大分越高']
  ];

  /* 作者署名 —— 版权标识，请勿移除。@author wangzhuo <mail_zhuo@163.com> */
  var SIGN = '<div class="sign">作者 <b>@wangzhuo</b></div>';

  var ui = {
    setStats: function (score, level, lines, best) {
      elScore.textContent = score;
      elLevel.textContent = level;
      elLines.textContent = lines;
    },
    renderNext: function (list) {
      for (var i = 0; i < nexts.length; i++) {
        var c = nexts[i];
        var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        // 强制布局同步：确保 flex 已算完，取到准确的渲染尺寸
        var rect = c.getBoundingClientRect();
        var w = rect.width || c.clientWidth || 52;
        var h = rect.height || c.clientHeight || 42;
        c.width = w * dpr; c.height = h * dpr;
        c.style.width = w + 'px';   // 显式锁定，防止 flex 回缩导致偏移
        var cx = c.getContext('2d');
        cx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (list[i]) TZ.Renderer.drawMini(cx, list[i], w, h);
        else cx.clearRect(0, 0, w, h);
      }
    },
    hideOverlay: function () { overlay.classList.add('hidden'); },
    showStart: function () {
      var rows = GUIDE.map(function (g) {
        return '<div class="grow">' + g[0] + '<div class="gtext">' + g[1] + '<em>' + g[2] + '</em></div></div>';
      }).join('');
      overlay.innerHTML =
        '<h1>魔方坠落</h1><div class="sub">GESTURE TETRIS</div>' +
        '<div class="guide">' + rows + '</div>' +
        '<div class="cta-row">' +
          '<button class="cta" id="cta-solo">单机模式</button>' +
          '<button class="cta online" id="cta-online">联机对战</button>' +
          '<div class="mode-tip">联机对战需连接服务器 · 与好友实时对决</div>' +
        '</div>';
      overlay.classList.remove('hidden');
      document.getElementById('cta-solo').onclick = function () {
        // 首次进入且未完成教程 → 先走新手引导；否则直接开局
        if (game.tutorial && !TZ.Tutorial.isDone()) game.tutorial.start();
        else game.start();
      };
      document.getElementById('cta-online').onclick = function () {
        // 跳转到联机对战页面（server/index.js 已将 /battle 与 /battle.html 映射到 battle.html）
        location.href = 'battle.html';
      };
    },

    /* 新手引导层的 UI 接口 */
    showTutorial: function () {
      var t = document.getElementById('tut');
      t.classList.remove('hidden');
      document.getElementById('app').classList.add('tut-mode');
      // 隐藏主菜单遮罩，避免与教程层重叠导致无法操作
      overlay.classList.add('hidden');
    },
    hideTutorial: function () {
      var t = document.getElementById('tut');
      t.classList.add('hidden');
      document.getElementById('app').classList.remove('tut-mode');
    },
    showTutorialStep: function (step, index, total) {
      document.getElementById('tut-icon').innerHTML = step.icon || '';
      document.getElementById('tut-title').textContent = step.title || '';
      document.getElementById('tut-desc').textContent = step.desc || '';
      var s = document.getElementById('tut-status');
      s.textContent = '请在棋盘上试一试 👆';
      s.className = 'tut-status';
      var dots = '';
      for (var i = 0; i < total; i++) {
        dots += '<span class="dot' + (i < index ? ' on' : '') + (i === index ? ' cur' : '') + '"></span>';
      }
      document.getElementById('tut-dots').innerHTML = dots;
      document.getElementById('tut-prog').textContent = (index + 1) + ' / ' + total;
    },
    setTutorialStatus: function (text, cls) {
      var s = document.getElementById('tut-status');
      s.textContent = text;
      s.className = 'tut-status' + (cls ? ' ' + cls : '');
    },
    showPause: function () {
      overlay.innerHTML = '<h1>已暂停</h1><div class="sub">PAUSED</div>' +
        '<div class="cta-stack">' +
          '<button class="cta" id="cta-resume">继续</button>' +
          '<button class="cta ghost" id="cta-quit">退出本局游戏</button>' +
        '</div>' + SIGN;
      overlay.classList.remove('hidden');
      document.getElementById('cta-resume').onclick = function () { game.togglePause(); };
      document.getElementById('cta-quit').onclick = function () { game.quitToMenu(); };
    },
    showOver: function (score, lines, best) {
      var isNew = score >= best && score > 0;
      overlay.innerHTML =
        '<h1>' + (isNew ? '新纪录' : '游戏结束') + '</h1>' +
        '<div class="sub">' + (isNew ? 'NEW RECORD' : 'GAME OVER') + '</div>' +
        '<div class="final">' +
        '<div><div class="fk">SCORE</div><div class="fv' + (isNew ? ' gold' : '') + '">' + score + '</div></div>' +
        '<div><div class="fk">LINES</div><div class="fv">' + lines + '</div></div>' +
        '<div><div class="fk">BEST</div><div class="fv">' + best + '</div></div>' +
        '</div><div class="cta-stack">' +
          '<button class="cta" id="cta-again">再来一局</button>' +
          '<button class="cta ghost" id="cta-home">返回主界面</button>' +
        '</div>' + SIGN;
      overlay.classList.remove('hidden');
      document.getElementById('cta-again').onclick = function () { game.start(); };
      document.getElementById('cta-home').onclick = function () { game.quitToMenu(); };
    }
  };

  /* 响应式：由可用高度反推最佳宽度，避免高度不足时两边大片留白。
     必须在创建 Game 之前先定好宽度，否则画布会按旧宽度初始化。 */
  var appEl = document.getElementById('app');
  var stageEl = document.getElementById('stage');
  var COLS = 10, ROWS = 20;
  var PAD_X = 24;    // #app 左右 padding 合计
  var INSET = 14;    // game.resize() 中棋盘四周的内缩量，需保持一致
  function fit() {
    // 先解除限制，量出当前视口下舞台的真实可用高度
    appEl.style.maxWidth = '';
    for (var i = 0; i < 2; i++) {   // 两遍：底栏文案换行会反过来影响舞台高度
      var stageH = stageEl.clientHeight;
      if (stageH <= 0) return;
      var cell = Math.floor((stageH - INSET) / ROWS);
      var ideal = cell * COLS + INSET + PAD_X;
      appEl.style.maxWidth = Math.max(300, Math.min(440, ideal)) + 'px';
    }
  }
  fit();

  var game = new TZ.Game({ canvas: document.getElementById('board'), ui: ui });
  window._game = game;
  game.tutorial = new TZ.Tutorial(game);   // 注入新手引导

  document.getElementById('btn-pause').onclick = function () {
    if (game.state === TZ.Game.STATE.READY || game.state === TZ.Game.STATE.OVER) return;
    game.togglePause();
  };

  document.getElementById('tut-skip').onclick = function () {
    if (game.tutorial && game.tutorial.active) game.tutorial.skip();
  };

  ui.renderNext(game.bag.peek(1));
  ui.showStart();
  game.loop();

  window.addEventListener('resize', function () {
    fit();   // 画布由 ResizeObserver 自动跟进，无需在此手动 resize
    setTimeout(function () { ui.renderNext(game.bag.peek(1)); }, 60);
  });
})();
</script>
</body>
</html>
