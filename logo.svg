<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="魔方坠落 Logo">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#1a1c2e"/>
      <stop offset="100%" stop-color="#080912"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a9ff"/>
      <stop offset="100%" stop-color="#7c5cf5"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cf5"/>
      <stop offset="100%" stop-color="#4a36b8"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ac2d8"/>
      <stop offset="100%" stop-color="#2a8aa8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 暗色圆角底 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 中心辉光晕 -->
  <ellipse cx="256" cy="250" rx="150" ry="150" fill="#7c5cf5" opacity="0.12" filter="url(#glow)"/>

  <!-- 3D 方块（等距立方体） -->
  <g filter="url(#glow)">
    <polygon points="256,150 380,228 256,306 132,228" fill="url(#top)"/>
    <polygon points="132,228 256,306 256,452 132,374" fill="url(#left)"/>
    <polygon points="256,306 380,228 380,374 256,452" fill="url(#right)"/>
  </g>

  <!-- 方块表面分格线（暗色，营造魔方/钻石块质感） -->
  <g stroke="#0b0c16" stroke-width="3" opacity="0.5" fill="none" stroke-linecap="round">
    <line x1="194" y1="189" x2="318" y2="267"/>
    <line x1="318" y1="189" x2="194" y2="267"/>
    <line x1="194" y1="267" x2="194" y2="413"/>
    <line x1="132" y1="301" x2="256" y2="379"/>
    <line x1="318" y1="267" x2="318" y2="413"/>
    <line x1="380" y1="301" x2="256" y2="379"/>
  </g>

  <!-- 棱边高光 -->
  <g stroke="#e6ecff" stroke-width="2.5" opacity="0.55" fill="none" stroke-linejoin="round">
    <polygon points="256,150 380,228 256,306 132,228"/>
    <polyline points="132,228 256,306 380,228"/>
    <line x1="256" y1="306" x2="256" y2="452"/>
  </g>

  <!-- 上方坠落的小钻石（点题「坠落」） -->
  <g fill="#4ac2d8" opacity="0.92" filter="url(#glow)">
    <polygon points="356,86 370,100 356,114 342,100"/>
    <polygon points="166,118 178,130 166,142 154,130"/>
  </g>
</svg>
